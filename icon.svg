<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d4fc4"/>
      <stop offset="100%" stop-color="#5b3fa8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- 開いた本 -->
  <g transform="translate(50,52)">
    <!-- 左ページ -->
    <path d="M -32,-16
             C -22,-21 -10,-19 0,-13
             L 0,20
             C -10,14 -22,12 -32,17
             Z"
          fill="#f4f1fb"/>
    <!-- 右ページ -->
    <path d="M 32,-16
             C 22,-21 10,-19 0,-13
             L 0,20
             C 10,14 22,12 32,17
             Z"
          fill="#ffffff"/>
    <!-- 背表紙の谷 -->
    <path d="M 0,-13 L 0,20" stroke="#c9bdea" stroke-width="1.5" fill="none"/>

    <!-- 左ページのテキスト行 -->
    <line x1="-26" y1="-8" x2="-6" y2="-11" stroke="#b8a9dd" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-26" y1="-1" x2="-6" y2="-4" stroke="#b8a9dd" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-26" y1="6" x2="-6" y2="3" stroke="#b8a9dd" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 右ページのテキスト行 -->
    <line x1="6" y1="-11" x2="26" y2="-8" stroke="#d8d0ec" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="6" y1="-4" x2="26" y2="-1" stroke="#d8d0ec" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="6" y1="3" x2="26" y2="6" stroke="#d8d0ec" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
